extContent=t;const points=c.hit+c.half*.5, pct=t?Math.round(points/t*100):0, abs=(Number.isInteger(points)?points:points.toFixed(1).replace('.',','));q('#rate').innerHTML='<span class="rate-main">'+pct+' %</span><span class="rate-abs">('+abs+'/'+t+')</span>';q('#hc').textContent=t+' '+(t===1?'Eintrag':'Einträge');let h=q('#history');h.innerHTML='';if(!t){h.innerHTML='<div class="empty">Noch keine Schüsse erfasst.</div>';return}s.history.slice().reverse().forEach((x,i)=>{let e=document.createElement('div');e.className='entry';e.innerHTML='<b>#'+(t-i)+'</b><strong>'+names[x.type]+'</strong><time>'+new Date(x.time).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})+'</time>';h.appendChild(e)})}function add(k){s.history.push({type:k,time:Date.now()});if(s.history.length>500)s.history.shift();render();save()}function remove(k){for(let i=s.history.length-1;i>=0;i--)if(s.history[i].type===k){s.history.splice(i,1);render();save();if(navigator.vibrate)navigator.vibrate(40);return}}document.querySelectorAll('[data-shot]').forEach(b=>{b.onpointerdown=()=>{long=false;b.classList.add('pressing');tm=setTimeout(()=>{long=true;remove(b.dataset.shot);b.classList.remove('pressing')},600)};b.onpointerup=()=>{clearTimeout(tm);b.classList.remove('pressing');if(!long)add(b.dataset.shot)};b.onpointercancel=()=>{clearTimeout(tm);b.classList.remove('pressing')};b.oncontextmenu=e=>e.preventDefault()});q('#reset').onclick=()=>{if(confirm('Alle Werte und den Verlauf zurücksetzen?')){s={history:[]};render();save()}};render()})()</script>
